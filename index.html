<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030812;
  color: #00eaff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 25px;
  text-align: center;
}

h1 {
  letter-spacing: 8px;
  margin-bottom: 12px;
  text-shadow: 0 0 15px #00eaff;
}

.status {
  color: #8ba6b5;
  margin-bottom: 40px;
}

.circle {
  width: 210px;
  height: 210px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 25px #00eaff,
              inset 0 0 25px #00eaff;
  animation: pulse 2s infinite;
}

.circle span {
  font-size: 65px;
}

@keyframes pulse {
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 45px #00eaff;
  }
}

#result {
  margin: 30px 0;
  min-height: 45px;
  color: white;
  line-height: 1.6;
}

button {
  background: transparent;
  border: 2px solid #00eaff;
  color: #00eaff;
  padding: 14px 25px;
  border-radius: 30px;
  font-size: 16px;
  margin: 7px;
}

button:active {
  background: #00eaff;
  color: black;
}

.chat {
  margin-top: 30px;
  color: #9abacb;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h1>J.A.R.V.I.S</h1>
<p class="status">PERSONAL AI SYSTEM</p>

<div class="circle">
  <span>◉</span>
</div>

<p id="result">SYSTEM ONLINE</p>

<button onclick="startJarvis()">START VOICE</button>

<button onclick="speak('Hello! I am Jarvis.')">
TEST VOICE
</button>

<div class="chat">
ADVANCED AI ASSISTANT<br>
VERSION 1.0
</div>

</div>

<script>
function speak(message) {
  if (!('speechSynthesis' in window)) {
    document.getElementById("result").innerText =
      "Voice not supported";
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "hi-IN";
  window.speechSynthesis.speak(voice);
}

function startJarvis() {
  const result = document.getElementById("result");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    result.innerText =
      "Speech Recognition not supported";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    result.innerText = "LISTENING... बोलिए";
  };

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript.toLowerCase();

    result.innerText = "YOU SAID: " + command;

    if (command.includes("hello") ||
        command.includes("नमस्ते")) {
      speak("नमस्ते! मैं जार्विस हूँ।");
    }
    else if (command.includes("your name") ||
             command.includes("नाम")) {
      speak("मेरा नाम जार्विस है।");
    }
    else if (command.includes("time") ||
             command.includes("समय")) {
      speak("अभी का समय है " +
        new Date().toLocaleTimeString("hi-IN"));
    }
    else if (command.includes("date") ||
             command.includes("तारीख")) {
      speak("आज की तारीख है " +
        new Date().toLocaleDateString("hi-IN"));
    }
    else {
      speak("मैंने सुना " + command +
        "। मुझे इस सवाल का जवाब अभी नहीं पता।");
    }
  };

  recognition.onerror = function(event) {
    result.innerText = "ERROR: " + event.error;
  };

  try {
    recognition.start();
  } catch(error) {
    result.innerText = "ERROR: " + error.message;
  }
}
</script>

</body>
</html>
